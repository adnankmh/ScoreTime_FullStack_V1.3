<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ScoreTime — live football, match intelligence, news, transfers and fan experiences. Every moment counts.">
  <meta name="theme-color" content="#020716">
  <meta name="color-scheme" content="dark light">
  <meta name="application-name" content="ScoreTime">
  <meta name="apple-mobile-web-app-title" content="ScoreTime">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta property="og:title" content="ScoreTime">
  <meta property="og:description" content="Every moment counts. Live football, intelligence, news and transfers.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <title>ScoreTime — Every moment counts</title>

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #020716;
      color: #f7fbff;
    }
    body {
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #scoretime-splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 9999;
      background:
        radial-gradient(circle at 50% 25%, rgba(11,140,255,.20), transparent 35%),
        radial-gradient(circle at 70% 70%, rgba(24,215,255,.10), transparent 35%),
        #020716;
      transition: opacity .35s ease;
    }
    #scoretime-splash .brand {
      text-align: center;
      letter-spacing: -.04em;
      font-size: clamp(34px, 7vw, 64px);
      font-weight: 900;
    }
    #scoretime-splash .brand span { color: #18d7ff; }
    #scoretime-splash .tagline {
      margin-top: 8px;
      color: rgba(255,255,255,.62);
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    #scoretime-splash .bar {
      width: 180px;
      height: 3px;
      margin: 24px auto 0;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
    }
    #scoretime-splash .bar::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg,#0b8cff,#18d7ff);
      animation: scoretime-load 1.05s ease-in-out infinite alternate;
    }
    @keyframes scoretime-load {
      from { transform: translateX(-20%); }
      to { transform: translateX(145%); }
    }
  </style>
</head>
<body>
  <div id="scoretime-splash" aria-label="Loading ScoreTime">
    <div>
      <div class="brand">Score<span>Time</span></div>
      <div class="tagline">Every moment counts</div>
      <div class="bar"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('scoretime-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
