name: scoretime
publish_to: none
description: Global football live scores, editorial, fan league and statistics platform.
version: 1.7.0+40
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  cached_network_image: ^3.4.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
