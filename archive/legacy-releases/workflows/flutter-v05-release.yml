name: V0.5 Build APK - No Android Studio
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Laravel API URL, example: https://example.com/api/v1'
        required: true
        default: 'https://example.com/api/v1'
permissions:
  contents: read
jobs:
  validate-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL="${{ inputs.api_base_url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ScoreTime-V05-APK
          path: mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
