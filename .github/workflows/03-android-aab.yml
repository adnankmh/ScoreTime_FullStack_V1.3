name: "ScoreTime • Android AAB"

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Laravel API URL ending in /api/v1"
        required: true
        default: "https://example.com/api/v1"

permissions:
  contents: read

concurrency:
  group: scoretime-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter • AAB Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Generate Android platform when missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.scoretime --project-name scoretime --no-pub
          fi

      - name: Apply ScoreTime icon and name
        shell: bash
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp "../tooling/android-icons/$density/ic_launcher.png" \
               "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          sed -i 's/android:label="scoretime"/android:label="ScoreTime"/g' android/app/src/main/AndroidManifest.xml

      - name: Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build AAB
        run: flutter build appbundle --release --dart-define=API_BASE_URL="${{ inputs.api_base_url }}"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ScoreTime-V1.4.3-AAB
          if-no-files-found: error
          retention-days: 14
          path: mobile-flutter/build/app/outputs/bundle/release/app-release.aab
