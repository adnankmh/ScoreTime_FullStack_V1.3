name: "ScoreTime • iOS"

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Laravel API URL ending in /api/v1"
        required: true
        default: "https://example.com/api/v1"

permissions:
  contents: read

concurrency:
  group: scoretime-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter • iOS Release
    runs-on: macos-latest

    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter 3.47.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Generate iOS platform when missing
        shell: bash
        run: |
          if [ ! -d ios ]; then
            flutter create . \
              --platforms=ios \
              --org com.scoretime \
              --project-name scoretime \
              --no-pub
          fi

      - name: Apply ScoreTime iOS identity
        shell: bash
        run: |
          rm -rf ios/Runner/Assets.xcassets/AppIcon.appiconset
          mkdir -p ios/Runner/Assets.xcassets/AppIcon.appiconset
          cp -R ../tooling/ios-appicon/. ios/Runner/Assets.xcassets/AppIcon.appiconset/

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName ScoreTime" ios/Runner/Info.plist \
            || /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string ScoreTime" ios/Runner/Info.plist

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL="${{ inputs.api_base_url }}"

      - name: Package iOS app
        shell: bash
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app ScoreTime-iOS-Unsigned.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v6
        with:
          name: ScoreTime-V1.4.4-iOS-Unsigned
          if-no-files-found: error
          retention-days: 14
          path: mobile-flutter/build/ios/iphoneos/ScoreTime-iOS-Unsigned.zip
