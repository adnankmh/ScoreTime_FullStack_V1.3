name: "ScoreTime • Android Release"
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Laravel API URL ending in /api/v1"
        required: true
        default: "https://example.com/api/v1"
permissions:
  contents: read
jobs:
  android:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Generate Android platform when missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.scoretime --project-name scoretime --no-pub
          fi
      - name: Apply ScoreTime launcher icons and app label
        shell: bash
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp "tooling/android-icons/$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          sed -i 's/android:label="scoretime"/android:label="ScoreTime"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="koraone"/android:label="ScoreTime"/g' android/app/src/main/AndroidManifest.xml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL="${{ inputs.api_base_url }}"
      - name: Build release AAB
        run: flutter build appbundle --release --dart-define=API_BASE_URL="${{ inputs.api_base_url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ScoreTime-V1.4-Android
          if-no-files-found: error
          path: |
            mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
            mobile-flutter/build/app/outputs/bundle/release/app-release.aab
