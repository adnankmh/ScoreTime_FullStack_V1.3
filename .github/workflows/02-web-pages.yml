name: "ScoreTime • Web / GitHub Pages"

on:
  push:
    branches: [main, master]
    paths:
      - "mobile-flutter/**"
      - ".github/workflows/02-web-pages.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Public ScoreTime Laravel API ending in /api/v1 (or configure SCORETIME_API_BASE_URL repository variable)"
        required: false
        type: string
      allow_demo_mode:
        description: "Explicitly publish preview data instead of a real backend"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scoretime-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Flutter Web • Verify • Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Flutter 3.47.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Ensure Flutter Web platform
        shell: bash
        run: |
          BRAND_BACKUP="$RUNNER_TEMP/scoretime-web-brand"
          mkdir -p "$BRAND_BACKUP"
          if [ -d web ]; then
            cp -a web/. "$BRAND_BACKUP/"
          fi

          flutter create . \
            --platforms=web \
            --org com.scoretime \
            --project-name scoretime \
            --no-pub

          if [ -f "$BRAND_BACKUP/index.html" ]; then
            cp -a "$BRAND_BACKUP/." web/
          fi

          if ! grep -q '<title>ScoreTime' web/index.html; then
            sed -i 's#<title>.*</title>#<title>ScoreTime — Every moment counts</title>#' web/index.html
          fi
          sed -i 's/"name": "scoretime"/"name": "ScoreTime"/g' web/manifest.json
          sed -i 's/"short_name": "scoretime"/"short_name": "ScoreTime"/g' web/manifest.json

          test -f web/index.html
          test -f web/manifest.json
          grep -q 'ScoreTime' web/index.html

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Select live backend, explicit preview, or first-launch setup
        id: mode
        shell: bash
        env:
          SCORETIME_INPUT_API_URL: ${{ inputs.api_base_url }}
          SCORETIME_REPOSITORY_API_URL: ${{ vars.SCORETIME_API_BASE_URL }}
          SCORETIME_ALLOW_DEMO: ${{ inputs.allow_demo_mode }}
        run: |
          RAW_URL="$SCORETIME_INPUT_API_URL"
          if [ -z "$RAW_URL" ]; then RAW_URL="$SCORETIME_REPOSITORY_API_URL"; fi
          if API_URL="$(bash ../tools/resolve_public_api_url.sh "$RAW_URL")"; then
            DEMO_MODE="false"
            SETUP_MODE="false"
          elif [ "$SCORETIME_ALLOW_DEMO" = "true" ]; then
            API_URL="https://scoretime-preview.invalid/api/v1"
            DEMO_MODE="true"
            SETUP_MODE="false"
          else
            API_URL=""
            DEMO_MODE="false"
            SETUP_MODE="true"
            echo "No real API URL supplied. Pages will open the server setup screen instead of fake scores."
          fi
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "demo_mode=$DEMO_MODE" >> "$GITHUB_OUTPUT"
          echo "setup_mode=$SETUP_MODE" >> "$GITHUB_OUTPUT"

      - name: Build web
        shell: bash
        env:
          SCORETIME_BUILD_API_URL: ${{ steps.mode.outputs.api_url }}
          SCORETIME_BUILD_DEMO_MODE: ${{ steps.mode.outputs.demo_mode }}
        run: |
          BASE_HREF="/${GITHUB_REPOSITORY#*/}/"
          flutter build web \
            --release \
            --base-href "$BASE_HREF" \
            --dart-define=API_BASE_URL="$SCORETIME_BUILD_API_URL" \
            --dart-define=WEB_DEMO_MODE="$SCORETIME_BUILD_DEMO_MODE"

      - name: GitHub Pages fallback
        run: |
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: mobile-flutter/build/web

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
