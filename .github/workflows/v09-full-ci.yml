name: V0.9 Full Validation & APK
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Laravel API base URL ending with /api/v1
        required: true
        default: https://example.com/api/v1
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend-laravel}}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: mbstring, sqlite3, pdo_sqlite}
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: touch database/database.sqlite
      - run: php artisan migrate --force
        env: {DB_CONNECTION: sqlite, DB_DATABASE: database/database.sqlite}
      - run: php artisan db:seed --force
        env: {DB_CONNECTION: sqlite, DB_DATABASE: database/database.sqlite}
      - run: php artisan route:list
      - run: php artisan test
        env: {DB_CONNECTION: sqlite, DB_DATABASE: database/database.sqlite}
      - run: php artisan notifications:dispatch-campaigns
        env: {DB_CONNECTION: sqlite, DB_DATABASE: database/database.sqlite}
  flutter:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile-flutter}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ inputs.api_base_url }}
      - uses: actions/upload-artifact@v4
        with: {name: ScoreTime-V09-APK, path: mobile-flutter/build/app/outputs/flutter-apk/app-release.apk}
