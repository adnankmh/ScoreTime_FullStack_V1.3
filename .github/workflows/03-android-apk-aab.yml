name: "ScoreTime • Android APK + AAB"

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Public ScoreTime Laravel API ending in /api/v1"
        required: true
        default: "https://example.com/api/v1"

permissions:
  contents: read

jobs:
  build:
    name: Flutter • APK + AAB
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter 3.47.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Validate public API URL
        shell: bash
        env:
          SCORETIME_BUILD_API_URL: ${{ inputs.api_base_url }}
        run: |
          API_URL="$SCORETIME_BUILD_API_URL"
          if [[ ! "$API_URL" =~ ^https://.+/api/v1/?$ ]] || [[ "$API_URL" == *"example.com"* ]]; then
            echo "api_base_url must be your real HTTPS Laravel endpoint ending in /api/v1"
            exit 1
          fi

      - name: Generate Android platform when missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.scoretime --project-name scoretime --no-pub
          fi

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: ScoreTime Android identity
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp "../tooling/android-icons/$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          sed -i 's/android:label="scoretime"/android:label="ScoreTime"/g' android/app/src/main/AndroidManifest.xml || true
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build APK
        env:
          SCORETIME_BUILD_API_URL: ${{ inputs.api_base_url }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$SCORETIME_BUILD_API_URL"

      - name: Build AAB
        env:
          SCORETIME_BUILD_API_URL: ${{ inputs.api_base_url }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL="$SCORETIME_BUILD_API_URL"

      - name: Verify outputs
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android
        uses: actions/upload-artifact@v6
        with:
          name: ScoreTime-V1.7.0-Android
          retention-days: 14
          if-no-files-found: error
          path: |
            mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
            mobile-flutter/build/app/outputs/bundle/release/app-release.aab
