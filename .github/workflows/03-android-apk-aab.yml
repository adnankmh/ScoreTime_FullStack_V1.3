name: "ScoreTime • Android APK + AAB"

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Laravel API URL ending in /api/v1"
        required: true
        default: "https://example.com/api/v1"

permissions:
  contents: read

concurrency:
  group: scoretime-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter • Android Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter 3.47.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Repair stale pre-ScoreTime widget test if present
        shell: bash
        run: |
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            cat > test/widget_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:scoretime/main.dart';

          void main() {
            test('ScoreTimeApp is available', () {
              const app = ScoreTimeApp();
              expect(app, isA<ScoreTimeApp>());
            });
          }
          DART
          fi

      - name: Generate Android platform when missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create . \
              --platforms=android \
              --org com.scoretime \
              --project-name scoretime \
              --no-pub
          fi

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply ScoreTime icon and name
        shell: bash
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp "../tooling/android-icons/$density/ic_launcher.png" \
               "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done

          if grep -q 'android:label="scoretime"' android/app/src/main/AndroidManifest.xml; then
            sed -i 's/android:label="scoretime"/android:label="ScoreTime"/g' \
              android/app/src/main/AndroidManifest.xml
          fi

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL="${{ inputs.api_base_url }}"

      - name: Build AAB
        run: flutter build appbundle --release --dart-define=API_BASE_URL="${{ inputs.api_base_url }}"

      - name: Verify Android outputs
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v6
        with:
          name: ScoreTime-V1.5.0-Android
          if-no-files-found: error
          retention-days: 14
          path: |
            mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
            mobile-flutter/build/app/outputs/bundle/release/app-release.aab
