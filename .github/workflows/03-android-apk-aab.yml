name: "ScoreTime • Android APK + AAB"

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Optional public HTTPS Laravel API ending in /api/v1; leave blank for easy first-launch choices"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Flutter • APK + AAB
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter 3.47.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve live API or safe first-launch setup
        id: api
        shell: bash
        env:
          SCORETIME_INPUT_API_URL: ${{ inputs.api_base_url }}
          SCORETIME_REPOSITORY_API_URL: ${{ vars.SCORETIME_API_BASE_URL }}
        run: |
          RAW_URL="$SCORETIME_INPUT_API_URL"
          if [ -z "$RAW_URL" ]; then RAW_URL="$SCORETIME_REPOSITORY_API_URL"; fi
          if API_URL="$(bash ../tools/resolve_public_api_url.sh "$RAW_URL")"; then
            SETUP_MODE="false"
            echo "A verified public API URL will be embedded."
          else
            API_URL=""
            SETUP_MODE="true"
            echo "No real API URL supplied. The APK will open the secure server setup screen on first launch."
          fi
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "setup_mode=$SETUP_MODE" >> "$GITHUB_OUTPUT"

      - name: Generate Android platform when missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.scoretime --project-name scoretime --no-pub
          fi

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: ScoreTime Android identity
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp "../tooling/android-icons/$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          sed -i 's/android:label="scoretime"/android:label="ScoreTime"/g' android/app/src/main/AndroidManifest.xml || true
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          fi
          if ! grep -q 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build APK
        env:
          SCORETIME_BUILD_API_URL: ${{ steps.api.outputs.api_url }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$SCORETIME_BUILD_API_URL"

      - name: Build AAB
        env:
          SCORETIME_BUILD_API_URL: ${{ steps.api.outputs.api_url }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL="$SCORETIME_BUILD_API_URL"

      - name: Verify outputs
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android
        uses: actions/upload-artifact@v6
        with:
          name: ScoreTime-V1.7.3-Android
          retention-days: 14
          if-no-files-found: error
          path: |
            mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
            mobile-flutter/build/app/outputs/bundle/release/app-release.aab
