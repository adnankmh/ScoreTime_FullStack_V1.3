name: "ScoreTime • iOS"

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Public ScoreTime Laravel API ending in /api/v1"
        required: true
        default: "https://example.com/api/v1"

permissions:
  contents: read

jobs:
  build:
    name: Flutter • iOS Unsigned Release
    runs-on: macos-latest

    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter 3.47.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Validate public API URL
        shell: bash
        env:
          SCORETIME_BUILD_API_URL: ${{ inputs.api_base_url }}
        run: |
          if [[ ! "$SCORETIME_BUILD_API_URL" =~ ^https://.+/api/v1/?$ ]] || [[ "$SCORETIME_BUILD_API_URL" == *"example.com"* ]]; then
            echo "api_base_url must be your real HTTPS Laravel endpoint ending in /api/v1"
            exit 1
          fi

      - name: Generate iOS platform when missing
        run: |
          if [ ! -d ios ]; then
            flutter create . --platforms=ios --org com.scoretime --project-name scoretime --no-pub
          fi

      - name: Apply ScoreTime iOS icon/name
        run: |
          rm -rf ios/Runner/Assets.xcassets/AppIcon.appiconset
          mkdir -p ios/Runner/Assets.xcassets/AppIcon.appiconset
          cp -R ../tooling/ios-appicon/. ios/Runner/Assets.xcassets/AppIcon.appiconset/
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ScoreTime" ios/Runner/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ScoreTime" ios/Runner/Info.plist

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build iOS unsigned
        env:
          SCORETIME_BUILD_API_URL: ${{ inputs.api_base_url }}
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL="$SCORETIME_BUILD_API_URL"

      - name: Package
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app ScoreTime-iOS-Unsigned.zip

      - name: Upload iOS
        uses: actions/upload-artifact@v6
        with:
          name: ScoreTime-V1.7.0-iOS-Unsigned
          retention-days: 14
          if-no-files-found: error
          path: mobile-flutter/build/ios/iphoneos/ScoreTime-iOS-Unsigned.zip
