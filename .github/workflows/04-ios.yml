name: "ScoreTime • iOS"

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Optional real HTTPS Laravel API ending in /api/v1; leave blank for first-launch setup"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Flutter • iOS Unsigned Release
    runs-on: macos-latest

    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter 3.47.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve live API or safe first-launch setup
        id: api
        shell: bash
        env:
          SCORETIME_INPUT_API_URL: ${{ inputs.api_base_url }}
          SCORETIME_REPOSITORY_API_URL: ${{ vars.SCORETIME_API_BASE_URL }}
        run: |
          RAW_URL="$SCORETIME_INPUT_API_URL"
          if [ -z "$RAW_URL" ]; then RAW_URL="$SCORETIME_REPOSITORY_API_URL"; fi
          if API_URL="$(bash ../tools/resolve_public_api_url.sh "$RAW_URL")"; then
            SETUP_MODE="false"
          else
            API_URL=""
            SETUP_MODE="true"
            echo "No real API URL supplied. The app will request it on first launch."
          fi
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "setup_mode=$SETUP_MODE" >> "$GITHUB_OUTPUT"

      - name: Generate iOS platform when missing
        run: |
          if [ ! -d ios ]; then
            flutter create . --platforms=ios --org com.scoretime --project-name scoretime --no-pub
          fi

      - name: Apply ScoreTime iOS icon/name
        run: |
          rm -rf ios/Runner/Assets.xcassets/AppIcon.appiconset
          mkdir -p ios/Runner/Assets.xcassets/AppIcon.appiconset
          cp -R ../tooling/ios-appicon/. ios/Runner/Assets.xcassets/AppIcon.appiconset/
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ScoreTime" ios/Runner/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ScoreTime" ios/Runner/Info.plist

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build iOS unsigned
        env:
          SCORETIME_BUILD_API_URL: ${{ steps.api.outputs.api_url }}
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL="$SCORETIME_BUILD_API_URL"

      - name: Package
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app ScoreTime-iOS-Unsigned.zip

      - name: Upload iOS
        uses: actions/upload-artifact@v6
        with:
          name: ScoreTime-V1.7.3-iOS-Unsigned
          retention-days: 14
          if-no-files-found: error
          path: mobile-flutter/build/ios/iphoneos/ScoreTime-iOS-Unsigned.zip
